<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Weather API</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/weather.css">
</head>

<body>

    <!-- NAVBAR -->
    <div id="navbar"></div>
    <!-- <script>
        fetch("components/navbar.html")
            .then(res => res.text())
            .then(html => document.getElementById("navbar").innerHTML = html);
    </script> -->
    <script src="JS/navbar.js"></script>

    <!-- WEATHER CONTENT -->
    <div class="weather-wrapper">

        <div class="weather-box">
            <img
                class="weather-photo"
                src="https://as2.ftcdn.net/v2/jpg/00/37/58/91/1000_F_37589193_y931eTp0y0n3nI9EaKhZYh8wbEQwKGn9.jpg"
                alt="Immagine per la sezione meteo"
                loading="eager"
                decoding="async"
            >
            <h2>Weather API</h2>
            <p class="subtitle">Inserisci il nome della città per sapere le condizioni meteo</p>

            <form id="weather-form">
                <input type="text" id="city-input" name="city" placeholder="Nome della città" required>
                <button type="submit">Invia</button>
            </form>
        </div>


        <!-- RISULTATO METEO -->
        <div class="weather-box" id="weather-result"></div>
        <!-- fine del dom-->
    </div>
    <!-- FOOTER -->
    <div id="footer"></div>
    <!-- <script>
        fetch("components/footer.html")
            .then(res => res.text())
            .then(html => document.getElementById("footer").innerHTML = html);
    </script> -->
    <script src="JS/footer.js"></script>
    <script src="JS/weather.js"></script>
</body>

</html>
